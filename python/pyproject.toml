[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tukupay"
dynamic = ["version"]
description = "Server-side Python library for the TukuPay API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TukuPay" }]
keywords = ["tukupay", "payments", "mpesa", "kenya", "fintech", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://tuku.money"
Repository = "https://github.com/tukupay/tukupay-sdk"
Changelog = "https://github.com/tukupay/tukupay-sdk/blob/main/python/CHANGELOG.md"

[tool.hatch.version]
path = "src/tukupay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tukupay"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
